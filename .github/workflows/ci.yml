name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: frontiercap
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frontiercap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://frontiercap:postgres@localhost:5432/frontiercap_test
      DIRECT_URL: postgresql://frontiercap:postgres@localhost:5432/frontiercap_test
      API_KEY: ci_throwaway_key_that_is_definitely_longer_than_forty_chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
